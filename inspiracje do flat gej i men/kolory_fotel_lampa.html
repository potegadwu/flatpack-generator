<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kolory - Fotel i Lampa</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { background: #e2e8f0; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 40px; margin: 0; }
  h1 { text-align: center; color: #0f172a; margin-bottom: 10px; }
  p.sub { text-align: center; color: #64748b; margin-bottom: 40px; font-size: 1.1em;}
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1000px; margin: 0 auto; }
  .card { border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; background: white;}
  .label { padding: 20px; font-weight: bold; font-size: 16px; text-align: center; width: 100%; background: #fff; color: #333; border-top: 1px solid #eee; text-transform: uppercase; letter-spacing: 1px;}
</style>
</head>
<body>
  <h1>Wersje Kolorystyczne - Fotel & Lampa</h1>
  <p class="sub">Elegancki szeryfowy układ z Twojego załącznika w 4 nowych paletach barw</p>
  <div class="grid">
    
    <!-- 1: Niebieski, Czerwony, Biały -->
    <div class="card">
      <svg viewBox="0 0 400 400" width="100%" height="100%" style="background: #ffffff;">
        <g stroke="#1e3a8a" fill="none" stroke-width="2.5">
          <path d="M 230 100 L 240 70 L 280 70 L 290 100 Z" stroke-linejoin="round"/>
          <line x1="260" y1="100" x2="260" y2="200"/>
          <path d="M 240 200 Q 260 190 280 200"/>
          <line x1="260" y1="70" x2="260" y2="65"/>
          <line x1="250" y1="100" x2="250" y2="115"/>
          <path d="M 140 100 C 130 100, 120 120, 125 150 C 130 180, 140 190, 160 190 H 210 C 230 190, 240 180, 245 150 C 250 120, 240 100, 230 100 Z" stroke-linejoin="round"/>
          <path d="M 130 130 C 110 130, 110 160, 125 160"/>
          <path d="M 240 130 C 260 130, 260 160, 245 160"/>
          <path d="M 140 175 H 230 C 230 175, 230 160, 185 160 C 140 160, 140 175, 140 175 Z"/>
          <line x1="140" y1="190" x2="135" y2="210"/>
          <line x1="160" y1="190" x2="160" y2="215"/>
          <line x1="210" y1="190" x2="210" y2="215"/>
          <line x1="230" y1="190" x2="235" y2="210"/>
          <path d="M 100 200 C 90 180, 110 160, 120 150 M 270 150 C 280 160, 300 180, 290 200" stroke-linecap="round"/>
          <path d="M 100 200 V 270 C 100 300, 120 310, 130 310" stroke-linecap="round"/>
          <path d="M 290 200 V 270 C 290 300, 270 310, 260 310" stroke-linecap="round"/>
        </g>
        <text x="195" y="240" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#dc2626" text-anchor="middle" letter-spacing="4">FLAT</text>
        <text x="195" y="280" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#dc2626" text-anchor="middle" letter-spacing="4">PACK</text>
        <text x="195" y="320" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#dc2626" text-anchor="middle" letter-spacing="4">MAN</text>
      </svg>
      <div class="label">Białe tło, Granat, Czerwień</div>
    </div>

    <!-- 2: Niebieski i Żółty -->
    <div class="card">
      <svg viewBox="0 0 400 400" width="100%" height="100%" style="background: #1e3a8a;">
        <g stroke="#fbbf24" fill="none" stroke-width="2.5">
          <path d="M 230 100 L 240 70 L 280 70 L 290 100 Z" stroke-linejoin="round"/>
          <line x1="260" y1="100" x2="260" y2="200"/>
          <path d="M 240 200 Q 260 190 280 200"/>
          <line x1="260" y1="70" x2="260" y2="65"/>
          <line x1="250" y1="100" x2="250" y2="115"/>
          <path d="M 140 100 C 130 100, 120 120, 125 150 C 130 180, 140 190, 160 190 H 210 C 230 190, 240 180, 245 150 C 250 120, 240 100, 230 100 Z" stroke-linejoin="round"/>
          <path d="M 130 130 C 110 130, 110 160, 125 160"/>
          <path d="M 240 130 C 260 130, 260 160, 245 160"/>
          <path d="M 140 175 H 230 C 230 175, 230 160, 185 160 C 140 160, 140 175, 140 175 Z"/>
          <line x1="140" y1="190" x2="135" y2="210"/>
          <line x1="160" y1="190" x2="160" y2="215"/>
          <line x1="210" y1="190" x2="210" y2="215"/>
          <line x1="230" y1="190" x2="235" y2="210"/>
          <path d="M 100 200 C 90 180, 110 160, 120 150 M 270 150 C 280 160, 300 180, 290 200" stroke-linecap="round"/>
          <path d="M 100 200 V 270 C 100 300, 120 310, 130 310" stroke-linecap="round"/>
          <path d="M 290 200 V 270 C 290 300, 270 310, 260 310" stroke-linecap="round"/>
        </g>
        <text x="195" y="240" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="4">FLAT</text>
        <text x="195" y="280" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="4">PACK</text>
        <text x="195" y="320" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="4">MAN</text>
      </svg>
      <div class="label">Granatowe tło i Żółty</div>
    </div>

    <!-- 3: Pomarańczowy, Niebieski, Biały -->
    <div class="card">
      <svg viewBox="0 0 400 400" width="100%" height="100%" style="background: #1e3a8a;">
        <g stroke="#f97316" fill="none" stroke-width="2.5">
          <path d="M 230 100 L 240 70 L 280 70 L 290 100 Z" stroke-linejoin="round"/>
          <line x1="260" y1="100" x2="260" y2="200"/>
          <path d="M 240 200 Q 260 190 280 200"/>
          <line x1="260" y1="70" x2="260" y2="65"/>
          <line x1="250" y1="100" x2="250" y2="115"/>
          <path d="M 140 100 C 130 100, 120 120, 125 150 C 130 180, 140 190, 160 190 H 210 C 230 190, 240 180, 245 150 C 250 120, 240 100, 230 100 Z" stroke-linejoin="round"/>
          <path d="M 130 130 C 110 130, 110 160, 125 160"/>
          <path d="M 240 130 C 260 130, 260 160, 245 160"/>
          <path d="M 140 175 H 230 C 230 175, 230 160, 185 160 C 140 160, 140 175, 140 175 Z"/>
          <line x1="140" y1="190" x2="135" y2="210"/>
          <line x1="160" y1="190" x2="160" y2="215"/>
          <line x1="210" y1="190" x2="210" y2="215"/>
          <line x1="230" y1="190" x2="235" y2="210"/>
          <path d="M 100 200 C 90 180, 110 160, 120 150 M 270 150 C 280 160, 300 180, 290 200" stroke-linecap="round"/>
          <path d="M 100 200 V 270 C 100 300, 120 310, 130 310" stroke-linecap="round"/>
          <path d="M 290 200 V 270 C 290 300, 270 310, 260 310" stroke-linecap="round"/>
        </g>
        <text x="195" y="240" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">FLAT</text>
        <text x="195" y="280" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">PACK</text>
        <text x="195" y="320" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">MAN</text>
      </svg>
      <div class="label">Niebieskie tło, Biel, Pomarańcz</div>
    </div>

    <!-- 4: Fiolet i Pomarańcz -->
    <div class="card">
      <svg viewBox="0 0 400 400" width="100%" height="100%" style="background: #4c1d95;">
        <g stroke="#f97316" fill="none" stroke-width="2.5">
          <path d="M 230 100 L 240 70 L 280 70 L 290 100 Z" stroke-linejoin="round"/>
          <line x1="260" y1="100" x2="260" y2="200"/>
          <path d="M 240 200 Q 260 190 280 200"/>
          <line x1="260" y1="70" x2="260" y2="65"/>
          <line x1="250" y1="100" x2="250" y2="115"/>
          <path d="M 140 100 C 130 100, 120 120, 125 150 C 130 180, 140 190, 160 190 H 210 C 230 190, 240 180, 245 150 C 250 120, 240 100, 230 100 Z" stroke-linejoin="round"/>
          <path d="M 130 130 C 110 130, 110 160, 125 160"/>
          <path d="M 240 130 C 260 130, 260 160, 245 160"/>
          <path d="M 140 175 H 230 C 230 175, 230 160, 185 160 C 140 160, 140 175, 140 175 Z"/>
          <line x1="140" y1="190" x2="135" y2="210"/>
          <line x1="160" y1="190" x2="160" y2="215"/>
          <line x1="210" y1="190" x2="210" y2="215"/>
          <line x1="230" y1="190" x2="235" y2="210"/>
          <path d="M 100 200 C 90 180, 110 160, 120 150 M 270 150 C 280 160, 300 180, 290 200" stroke-linecap="round"/>
          <path d="M 100 200 V 270 C 100 300, 120 310, 130 310" stroke-linecap="round"/>
          <path d="M 290 200 V 270 C 290 300, 270 310, 260 310" stroke-linecap="round"/>
        </g>
        <text x="195" y="240" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#f97316" text-anchor="middle" letter-spacing="4">FLAT</text>
        <text x="195" y="280" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#f97316" text-anchor="middle" letter-spacing="4">PACK</text>
        <text x="195" y="320" font-family="'Cinzel', serif" font-size="36" font-weight="800" fill="#f97316" text-anchor="middle" letter-spacing="4">MAN</text>
      </svg>
      <div class="label">Głęboki Fiolet i Pomarańcz</div>
    </div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flat Pack Man - Business Card Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    background: #080a11;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    color: #F8FAFC;
    flex-direction: column;
    gap: 40px;
  }
  .card-container {
    perspective: 1000px;
  }
  .card {
    width: 85.6mm;
    height: 53.98mm; /* Standard ID-1 size ~ 3.37 x 2.125 inches */
    /* converting to px for screen: ~ 350x220px. We scale up for display. */
    width: 600px;
    height: 350px;
    background: #0F172A;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity: 0.05; mix-blend-mode: overlay;
  }
  .bg-shape {
    position: absolute;
    top: -100px;
    right: -100px;
    width: 400px;
    height: 400px;
    background: linear-gradient(135deg, #097EFF, #1E3A8A);
    border-radius: 50%;
    z-index: 0;
    filter: blur(80px);
    opacity: 0.6;
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 40px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .logo-icon {
    width: 45px;
    height: 45px;
    background: #097EFF;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    font-size: 24px;
    color: #FFF;
    border: 2px solid #FFD700;
    transform: rotate(15deg);
  }
  .logo-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #FFFFFF;
    line-height: 1;
  }
  .logo-sub {
    font-size: 10px;
    font-family: 'Montserrat', sans-serif;
    color: #FFD700;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 4px;
  }
  .bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .person {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .name {
    font-size: 24px;
    font-weight: 900;
    color: #FFFFFF;
    margin: 0;
  }
  .title {
    font-size: 12px;
    color: #00B67A;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Rajdhani', sans-serif;
  }
  .contact {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: right;
  }
  .contact-item {
    font-size: 12px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .contact-item span {
    color: #FFD700;
  }

  /* FRONT CARD */
  .card-front {
    background: #097EFF;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card-front .bg-shape {
    background: linear-gradient(135deg, #FFD700, #FF5722);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    opacity: 0.3;
  }
  .card-front .logo-icon {
    width: 80px;
    height: 80px;
    font-size: 40px;
    background: #FFD700;
    color: #0F172A;
    border-color: #FFF;
    margin: 0 auto 20px;
  }
  .card-front .logo-text {
    font-size: 48px;
  }
  .card-front .logo-sub {
    font-size: 14px;
    color: #0F172A;
  }

  h2 { font-family: 'Rajdhani', sans-serif; font-weight: 600; color: #64748b; letter-spacing: 2px; }
</style>
</head>
<body>

  <h2>FRONT (Mocne uderzenie marki)</h2>
  <div class="card-container">
    <div class="card card-front">
      <div class="grain"></div>
      <div class="bg-shape"></div>
      <div class="content" style="justify-content: center;">
        <div class="logo-area" style="flex-direction: column; gap: 0;">
          <div class="logo-icon">FP</div>
          <div class="logo-text">FLAT PACK MAN</div>
          <div class="logo-sub">Mission: Assembly Completed</div>
        </div>
      </div>
    </div>
  </div>

  <h2>BACK (Dane Kontaktowe / Inżynier)</h2>
  <div class="card-container">
    <div class="card">
      <div class="grain"></div>
      <div class="bg-shape"></div>
      
      <!-- Dekoracyjny pasek boczny -->
      <div style="position:absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #FFD700; z-index: 2;"></div>

      <div class="content">
        <div class="logo-area">
          <div class="logo-text">FLAT PACK MAN</div>
        </div>

        <div class="bottom-area">
          <div class="person">
            <h3 class="name">MICHAŁ</h3>
            <span class="title">Chief Assembly Officer / Commander</span>
          </div>
          
          <div class="contact">
            <div class="contact-item"><span>//</span> +44 7912 345 678</div>
            <div class="contact-item"><span>//</span> hello@flatpack.help</div>
            <div class="contact-item" style="color: #FFF;"><span>//</span> WWW.FLATPACK.HELP</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>

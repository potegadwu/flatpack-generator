<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flatpack Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F172A; 
  --panel: #1E293B; 
  --accent: #097EFF; 
  --border: #334155; 
  --text: #F8FAFC; 
  --muted: #64748B;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); 
  color: var(--text); 
  height: 100vh; 
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  opacity: 0.04; mix-blend-mode: overlay;
}
.app { display: flex; height: 100vh; position: relative; z-index: 2; }

.panel { width: 450px; min-width: 450px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.panel-scroll { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
.panel-scroll::-webkit-scrollbar { width: 6px; }
.panel-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
.panel-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.panel-header h1 { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
.panel-header span { font-family: 'Geist Mono', monospace; font-size: 0.75rem; color: var(--muted); }

.section { padding: 14px 0; border-bottom: 1px solid var(--border); }
.section-title { font-family: 'Geist Mono', monospace; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 10px; }

label { font-size: 0.75rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
input[type="text"], textarea, select { width: 100%; background: #0F172A; border: 1px solid var(--border); color: white; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }

.row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.row label { margin-bottom: 0; white-space: nowrap; }
input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
.slider-val { font-family: 'Geist Mono', monospace; font-size: 0.75rem; color: var(--text); min-width: 36px; text-align: right; }

.color-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch { width: 36px; height: 36px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; transition: border-color 0.15s; }
.color-swatch:hover { border-color: rgba(255,255,255,0.3); }
.color-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(9, 126, 255, 0.3); }

.small-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.small-btn:hover { background: rgba(255,255,255,0.07); }
.small-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

.btn-group { display: flex; gap: 4px; }
.font-btn { width: 34px; height: 30px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-size: 0.8rem; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.font-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
.font-btn:hover:not(.active) { background: rgba(255,255,255,0.05); }

.color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
.color-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(9, 126, 255, 0.3); }
.color-btn:hover:not(.active) { border-color: rgba(255,255,255,0.3); }

.btn-primary { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--accent); color: white; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 14px rgba(9, 126, 255, 0.4); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(9, 126, 255, 0.5); }

.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
.toggle-row label { margin-bottom: 0; font-size: 0.8rem; color: var(--text); }
.toggle-row input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }

.canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #080a11; overflow: hidden; position: relative; }
canvas { display: block; max-height: calc(100vh - 40px); max-width: calc(100% - 40px); cursor: grab; box-shadow: 0 20px 60px rgba(0,0,0,0.7); border-radius: 4px; }
canvas:active { cursor: grabbing; }
.hint { font-size: 0.65rem; color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<div class="grain"></div>
<div class="app">
<aside class="panel">
<div class="panel-header">
<h1>Flatpack Generator</h1>
<span>1080 x 1350 (4:5)</span>
</div>
<div class="panel-scroll">

<div class="section">
<div class="section-title">Tło</div>
<div class="color-grid" id="bgColors">
<button class="color-swatch active" style="background:#0F172A" onclick="setBgColor('#0F172A')"></button>
<button class="color-swatch" style="background:#1E3A8A" onclick="setBgColor('#1E3A8A')"></button>
<button class="color-swatch" style="background:#097EFF" onclick="setBgColor('#097EFF')"></button>
<button class="color-swatch" style="background:#00B67A" onclick="setBgColor('#00B67A')"></button>
<button class="color-swatch" style="background:#E7BA04" onclick="setBgColor('#E7BA04')"></button>
<button class="color-swatch" style="background:#FFFFFF;border:1px solid #ddd" onclick="setBgColor('#FFFFFF')"></button>
<button class="color-swatch" style="background:#F1F5F9;border:1px solid #ddd" onclick="setBgColor('#F1F5F9')"></button>
</div>
<div class="row" style="margin-top:10px; flex-wrap: wrap; gap: 6px;">
<button class="small-btn" id="gradientBtn" onclick="toggleGradient()">Gradient</button>
<label class="small-btn" for="photoUpload" style="cursor:pointer;text-align:center">Foto z dysku</label>
<input type="file" id="photoUpload" accept="image/*" hidden onchange="handlePhoto(event)">
<button class="small-btn" id="clearPhotoBtn" onclick="clearPhoto()" style="display:none">Usuń foto</button>
</div>
<div class="row" style="margin-top:10px; display:none" id="photoScaleContainer">
<label>Skala:</label>
<input type="range" id="photoScale" min="0.1" max="4.0" step="0.05" value="1.0" oninput="setPhotoScale(this.value)">
<span class="slider-val" id="photoScaleVal">1.0x</span>
</div>
<div class="row" id="bgOverlayContainer" style="margin-top:10px; display:none">
<label>Przyciemnienie:</label>
<input type="range" id="bgOverlay" min="0" max="1" step="0.05" value="0" oninput="state.bgOverlay=+this.value;document.getElementById('bgOverlayVal').textContent=Math.round(this.value*100)+'%';draw()">
<span class="slider-val" id="bgOverlayVal">0%</span>
</div>
</div>

<div class="section">
<div class="section-title">Nadtytuł</div>
<input type="text" id="kickerText" value="PROFESSIONAL ASSEMBLY" placeholder="np. PROFESSIONAL ASSEMBLY" oninput="draw()">
<div class="row" style="margin-top:8px">
<label>Kolor:</label>
<div class="btn-group">
<button class="color-btn active" style="background:#097EFF" onclick="setKickerColor('#097EFF',this)"></button>
<button class="color-btn" style="background:#00B67A" onclick="setKickerColor('#00B67A',this)"></button>
<button class="color-btn" style="background:#E7BA04" onclick="setKickerColor('#E7BA04',this)"></button>
<button class="color-btn" style="background:#0F172A" onclick="setKickerColor('#0F172A',this)"></button>
<button class="color-btn" style="background:#FFFFFF" onclick="setKickerColor('#FFFFFF',this)"></button>
</div>
</div>
</div>

<div class="section">
<div class="section-title">Tekst Główny</div>
<textarea id="mainText" style="min-height:180px;font-size:0.9rem;line-height:1.4" oninput="updateWordsFromText(this.value)" placeholder="Wpisz główne hasło..."></textarea>
<div id="lineSizesContainer"></div>
<div class="row">
<label>Interlinia:</label>
<input type="range" id="titleLH" min="0.6" max="2.0" step="0.05" value="0.95" oninput="state.titleLH=+this.value;document.getElementById('titleLHVal').textContent=this.value;draw()">
<span class="slider-val" id="titleLHVal">0.95</span>
</div>
<div class="row">
<label>Odstęp słów:</label>
<input type="range" id="wordSpacing" min="5" max="80" value="20" oninput="state.wordSpacing=+this.value;document.getElementById('wordSpacingVal').textContent=this.value+'px';draw()">
<span class="slider-val" id="wordSpacingVal">20px</span>
</div>

<label style="margin-top:12px; margin-bottom:2px">Edycja pojedynczych słów:</label>
<div style="max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 6px; padding: 4px;" id="wordsEditorContainer">
  <!-- Dynamic word editors list -->
</div>
</div>

<div class="section">
<div class="section-title">Dopisek pod hasłem</div>
<textarea id="paraText" placeholder="Dodatkowy tekst pod tytułem..." oninput="onParaInput(this)" maxlength="200" style="min-height:75px"></textarea>
<div style="font-size:0.7rem;color:var(--muted);text-align:right;margin-top:2px" id="paraCharCount">0/200</div>
<div class="row" style="margin-top:8px">
<label>Kolor:</label>
<div class="btn-group">
<button class="color-btn active" style="background:#FFFFFF" onclick="setParaColor('#FFFFFF',this)"></button>
<button class="color-btn" style="background:#097EFF" onclick="setParaColor('#097EFF',this)"></button>
<button class="color-btn" style="background:#00B67A" onclick="setParaColor('#00B67A',this)"></button>
<button class="color-btn" style="background:#E7BA04" onclick="setParaColor('#E7BA04',this)"></button>
</div>
</div>
<div class="row" style="margin-top:8px">
<label>Wyrównanie:</label>
<select id="paraAlign" onchange="state.paraAlign=this.value;draw()" style="width:auto;flex:1">
<option value="left">Do lewej</option>
<option value="center">Do środka</option>
</select>
</div>
</div>

<div class="section">
<div class="section-title">Logo (Czerwona torba)</div>
<div class="toggle-row">
  <label>Pokaż logo flatpack.help</label>
  <input type="checkbox" id="showLogo" checked onchange="state.showLogo=this.checked;draw()">
</div>
<div class="row">
  <label>Rozmiar logo:</label>
  <input type="range" id="logoScale" min="0.3" max="3.0" step="0.05" value="1.0" oninput="state.logoScale=+this.value;document.getElementById('logoScaleVal').textContent=this.value+'x';draw()">
  <span class="slider-val" id="logoScaleVal">1.0x</span>
</div>
</div>

<div class="section">
<div class="section-title">Stopka & Numeracja</div>
<input type="text" id="brandText" value="FLATPACK.HELP" oninput="draw()" style="margin-bottom:8px">
<div class="row">
<label>Pozycja:</label>
<select id="brandAlign" onchange="onBrandAlignChange(this.value)" style="width:auto;flex:1">
<option value="left">Dół - Lewa</option>
<option value="center">Dół - Środek</option>
<option value="right">Dół - Prawa</option>
<option value="top-right">Góra - Prawa</option>
</select>
</div>
<div class="row" style="margin-top:8px">
<label>Numer:</label>
<div style="display:flex;align-items:center;gap:4px;flex:1">
<button class="font-btn" style="width:30px;height:30px" onclick="adjustSlideNum(-1)">-</button>
<input type="text" id="slideText" value="01/03" style="text-align:center;flex:1" oninput="draw()" onblur="validateAndGetSlideText(true); draw()">
<button class="font-btn" style="width:30px;height:30px" onclick="adjustSlideNum(1)">+</button>
</div>
</div>
</div>

<div class="section">
<div class="section-title">Narzędzia</div>
<div class="toggle-row"><label>Pokaż marginesy 80px</label><input type="checkbox" id="showGuides" checked onchange="draw()"></div>
<div class="toggle-row"><label>Pokaż crop 1:1 (siatka IG)</label><input type="checkbox" id="showCrop" checked onchange="draw()"></div>
<div class="toggle-row"><label>Pokaż crop 3:4 (siatka profilu)</label><input type="checkbox" id="showGrid34" checked onchange="draw()"></div>
<div class="toggle-row"><label>Pokaż numerację</label><input type="checkbox" id="showSlideNum" checked onchange="draw()"></div>
<div class="toggle-row" style="border-top:1px dashed var(--border); margin-top:8px; padding-top:8px">
  <label style="font-weight:700; color:var(--text)">Dodaj aplę (kartę pod tekstem)</label>
  <input type="checkbox" id="showApla" onchange="toggleAplaControls(this.checked); state.showApla=this.checked; draw()">
</div>
<div id="aplaControls" style="display:none; margin-top:8px; border-left:2px solid var(--accent); padding-left:10px; margin-bottom:10px">
  <div class="row">
    <label>Styl apli:</label>
    <select id="aplaStyle" onchange="state.aplaStyle=this.value;draw()">
      <option value="light-glass">Jasne szkło (Glassmorphism)</option>
      <option value="dark-glass">Ciemne szkło</option>
      <option value="blue">Niebieska</option>
      <option value="green">Zielona (Trustpilot)</option>
      <option value="navy">Granatowa</option>
    </select>
  </div>
  <div class="row">
    <label>Szerokość:</label>
    <input type="range" id="aplaW" min="100" max="1080" value="880" oninput="state.aplaW=+this.value;document.getElementById('aplaWVal').textContent=this.value+'px';draw()">
    <span class="slider-val" id="aplaWVal">880px</span>
  </div>
  <div class="row">
    <label>Wysokość:</label>
    <input type="range" id="aplaH" min="100" max="1350" value="680" oninput="state.aplaH=+this.value;document.getElementById('aplaHVal').textContent=this.value+'px';draw()">
    <span class="slider-val" id="aplaHVal">680px</span>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="small-btn" style="width:100%" onclick="resetAplaPosition()">Wyśrodkuj aplę</button>
  </div>
</div>
</div>

<div class="section" style="border:none;padding-bottom:30px">
<button class="btn-primary" onclick="showPreview()">Podgląd i zapis PNG</button>
</div>

</div>
</aside>

<main class="canvas-area">
<canvas id="canvas" width="1080" height="1350"></canvas>
</main>
</div>

<div id="previewModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.98);z-index:1000;justify-content:center;align-items:center;overflow-y:auto;padding:20px">
  <div style="background:#1E293B; border: 1px solid var(--border); border-radius: 12px; display:flex; flex-direction:column; gap:16px; width:100%; max-width:1100px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5)">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); padding-bottom:12px">
      <h2 style="margin:0;font-size:1.2rem;font-weight:800;color:var(--text)">Podgląd publikacji na Instagramie</h2>
      <button class="small-btn" onclick="closePreview()" style="font-size:1.2rem; line-height:1; padding: 4px 10px">&times;</button>
    </div>
    
    <div style="display:flex; gap:24px; flex-wrap:wrap; justify-content:center">
      <!-- Left side: Single Post Mockup -->
      <div style="flex: 1.2; min-width:320px; max-width:550px">
        <div style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); margin-bottom:8px; font-weight:700">Podgląd posta (4:5)</div>
        <div id="previewPost" style="background:#fff; border-radius:8px; overflow:hidden; border:1px solid #dbdbdb; display:flex; flex-direction:column">
        </div>
      </div>
      
      <!-- Right side: Feed Grid -->
      <div style="flex: 1; min-width:320px; max-width:400px">
        <div id="gridHeader" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); margin-bottom:8px; font-weight:700">Siatka profilu (3:4)</div>
        <div style="display:flex; gap:6px; margin-bottom:10px">
          <button id="toggleGrid45" class="small-btn active" onclick="setGridUploadFormat('45')">Format uploadu: 4:5</button>
          <button id="toggleGrid11" class="small-btn" onclick="setGridUploadFormat('11')">Format uploadu: 1:1</button>
        </div>
        <div id="previewGrid" style="display:flex; flex-direction:column; gap:3px; background:#1E293B; padding:4px; border-radius:8px; border:1px solid var(--border)">
        </div>
      </div>
    </div>
    
    <div style="display:flex; gap:12px; width:100%; justify-content:flex-end; border-top: 1px solid var(--border); padding-top:16px; margin-top:8px">
      <button class="small-btn" onclick="closePreview()" style="padding:10px 24px;font-size:0.85rem">Wróć do edycji</button>
      <button class="btn-primary" onclick="executeDownload()" style="width:auto;padding:10px 28px;font-size:0.9rem">Zapisz PNG</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const M = 80;
let isExporting = false;

let grainPattern = null;
const grainImg = new Image();
grainImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>";
grainImg.onload = function() {
  grainPattern = ctx.createPattern(grainImg, 'repeat');
  draw();
};

const state = {
  bgType: 'color',
  bgColor: '#0F172A',
  bgPhoto: null,
  bgPhotoX: 0, bgPhotoY: 0, bgPhotoScale: 1,
  gradient: false,
  bgOverlay: 0.0,

  kickerText: 'PROFESSIONAL ASSEMBLY',
  kickerColor: '#097EFF',
  kickerX: 150, kickerY: 150,

  mainText: 'SAVE TIME, MONEY AND STRESS!',
  words: [],
  titleX: 150, titleY: 280,
  titleSize: 90,
  lineSizes: [90],
  titleLH: 0.95,
  wordSpacing: 20,

  paraText: 'NORTHERN IRELAND\'S LEADING FLAT PACK SPECIALISTS SINCE 2012',
  paraX: 150, paraY: 850,
  paraAlign: 'left',
  paraColor: '#FFFFFF',

  showApla: false,
  aplaStyle: 'light-glass',
  aplaX: 100,
  aplaY: 240,
  aplaW: 880,
  aplaH: 680,

  showLogo: true,
  logoX: 840,
  logoY: 130,
  logoScale: 1.0,
  logoImg: null,

  brandText: 'FLATPACK.HELP',
  brandAlign: 'left',
  brandX: 150, // Snapped inside safe horizontal zone (135px to 945px)
  brandY: 1180, // Snapped inside 1:1 crop boundary (135px to 1215px)

  slideText: '01/03',
  slideX: 930, // Snapped inside safe horizontal zone (135px to 945px)
  slideY: 1180, // Snapped inside 1:1 crop boundary (135px to 1215px)

  showGuides: true,
  showCrop: true,
  showSlideNum: true,
  showGrid34: true,
};

// Load red bag logo
const logoImg = new Image();
logoImg.src = 'assets/logo.png';
logoImg.onload = function() {
  state.logoImg = logoImg;
  draw();
};

let gridUploadFormat = '45';
let previewFullUrl = '';
let previewCropUrl = '';

function setGridUploadFormat(format) {
  gridUploadFormat = format;
  document.getElementById('toggleGrid45').classList.toggle('active', format === '45');
  document.getElementById('toggleGrid11').classList.toggle('active', format === '11');
  renderPreviewGrid();
}

function renderPreviewGrid() {
  const gc = document.getElementById('previewGrid');
  gc.innerHTML = '';
  const useFullUrl = gridUploadFormat === '45';
  const displayUrl = useFullUrl ? previewFullUrl : previewCropUrl;
  
  for (let r = 0; r < 3; r++) {
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.gap = '3px';
    row.style.width = '100%';
    for (let c = 0; c < 3; c++) {
      const cell = document.createElement('div');
      cell.style.width = '100%';
      cell.style.aspectRatio = '3/4'; // 3:4 profile grid aspect ratio
      cell.style.overflow = 'hidden';
      cell.style.borderRadius = '2px';
      cell.style.position = 'relative';
      cell.style.flex = '1';
      if (r === 0 && c === 0) { // Top-left is our new preview post in the grid
        const img = document.createElement('img');
        img.src = displayUrl;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        cell.appendChild(img);
        
        // Add carousel icon in the top right corner
        const carouselIcon = document.createElement('div');
        carouselIcon.style.cssText = 'position:absolute;top:8px;right:8px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);border-radius:3px;padding:3px';
        carouselIcon.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="13" height="13" rx="1.5"></rect>
          <path d="M21 8v11a2 2 0 0 1-2 2H8"></path>
        </svg>`;
        cell.appendChild(carouselIcon);
      } else {
        cell.style.background = '#1E293B';
        cell.style.border = '1px solid rgba(255,255,255,0.05)';
        cell.style.display = 'flex';
        cell.style.alignItems = 'center';
        cell.style.justifyContent = 'center';
        cell.innerHTML = '<span style="color:#64748b; font-size:10px; font-weight:600">Post ' + (9 - (r * 3 + c)) + '</span>';
      }
      row.appendChild(cell);
    }
    gc.appendChild(row);
  }
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      state.bgPhoto = img;
      state.bgType = 'photo';
      const ca = canvas.width / canvas.height;
      const ia = img.width / img.height;
      if (ia > ca) {
        state.bgPhotoScale = canvas.height / img.height;
        state.bgPhotoX = (canvas.width - img.width * state.bgPhotoScale) / 2;
        state.bgPhotoY = 0;
      } else {
        state.bgPhotoScale = canvas.width / img.width;
        state.bgPhotoX = 0;
        state.bgPhotoY = (canvas.height - img.height * state.bgPhotoScale) / 2;
      }
      document.getElementById('clearPhotoBtn').style.display = '';
      const scaleSlider = document.getElementById('photoScale');
      scaleSlider.min = (state.bgPhotoScale * 0.15).toFixed(2);
      scaleSlider.max = (state.bgPhotoScale * 6.0).toFixed(2);
      scaleSlider.value = state.bgPhotoScale.toFixed(2);
      document.getElementById('photoScaleVal').textContent = state.bgPhotoScale.toFixed(2) + 'x';
      document.getElementById('photoScaleContainer').style.display = 'flex';
      
      const overlayContainer = document.getElementById('bgOverlayContainer');
      if (overlayContainer) overlayContainer.style.display = 'flex';
      
      document.querySelectorAll('#bgColors .color-swatch').forEach(s => s.classList.remove('active'));
      document.getElementById('gradientBtn').classList.remove('active');
      draw();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function clearPhoto() {
  state.bgPhoto = null;
  state.bgType = state.gradient ? 'gradient' : 'color';
  document.getElementById('clearPhotoBtn').style.display = 'none';
  document.getElementById('photoScaleContainer').style.display = 'none';
  
  const overlayContainer = document.getElementById('bgOverlayContainer');
  if (overlayContainer) overlayContainer.style.display = 'none';
  state.bgOverlay = 0.0;
  const bgOverlayEl = document.getElementById('bgOverlay');
  if (bgOverlayEl) {
    bgOverlayEl.value = 0;
    const valEl = document.getElementById('bgOverlayVal');
    if (valEl) valEl.textContent = '0%';
  }
  
  document.getElementById('photoUpload').value = '';
  draw();
}

function setPhotoScale(val) {
  if (!state.bgPhoto) return;
  const oldScale = state.bgPhotoScale;
  const newScale = parseFloat(val);
  
  const canvasCenterX = canvas.width / 2;
  const canvasCenterY = canvas.height / 2;
  
  const imgCenterX = (canvasCenterX - state.bgPhotoX) / oldScale;
  const imgCenterY = (canvasCenterY - state.bgPhotoY) / oldScale;
  
  state.bgPhotoX = canvasCenterX - imgCenterX * newScale;
  state.bgPhotoY = canvasCenterY - imgCenterY * newScale;
  state.bgPhotoScale = newScale;
  
  document.getElementById('photoScaleVal').textContent = newScale.toFixed(2) + 'x';
  draw();
}

function updateWordsFromText(text) {
  state.mainText = text;
  const rawWords = text.trim().split(/\s+/).filter(Boolean);
  
  const newWords = rawWords.map((w, index) => {
    const oldWord = state.words.find((ow, oi) => ow.text === w && oi === index) 
                 || state.words.find(ow => ow.text === w);
                 
    if (oldWord) {
      return { text: w, font: oldWord.font, color: oldWord.color };
    }
    
    const uppercaseText = w.toUpperCase();
    const isSpecial = uppercaseText.includes('IKEA') || uppercaseText.includes('PAX') || uppercaseText.includes('STRESS') || uppercaseText.includes('MONEY') || uppercaseText.includes('TIME');
    
    return {
      text: w,
      font: isSpecial ? 'italic' : 'bold',
      color: isSpecial ? '#00B67A' : '#FFFFFF'
    };
  });
  
  state.words = newWords;
  
  // Dynamic lineSizes sync
  const rawLines = text.split('\n');
  const N = rawLines.length;
  if (!state.lineSizes) {
    state.lineSizes = [];
  }
  while (state.lineSizes.length < N) {
    state.lineSizes.push(state.titleSize || 90);
  }
  if (state.lineSizes.length > N) {
    state.lineSizes = state.lineSizes.slice(0, N);
  }
  
  renderLineSizesUI();
  renderWordsUI();
  draw();
}

    const labelText = rawLines.length === 1 ? 'Rozmiar:' : `Rozmiar linii ${index + 1}:`;

}

function onBrandAlignChange(val) {
  state.brandAlign = val;
  if (val === 'left') {
    state.brandX = 150; // Snapped inside safe horizontal zone (135px to 945px)
    state.brandY = 1180; // inside 1:1 crop (135px to 1215px)
    state.slideX = 930; // Snapped inside safe horizontal zone (135px to 945px)
    state.slideY = 1180;
  } else if (val === 'center') {
    state.brandX = canvas.width / 2; // 540
    state.brandY = 1180;
    state.slideX = 930; // Snapped inside safe horizontal zone (135px to 945px)
    state.slideY = 1180;
  } else if (val === 'right') {

    state.brandY = 1180;
    state.slideX = 150; // Snapped inside safe horizontal zone (135px to 945px)
    state.slideY = 1180;

    state.slideX = 150; // Snapped inside safe horizontal zone (135px to 945px)
    state.slideY = 1180;
  }

}

function validateAndGetSlideText(updateInput = false) {
  const el = document.getElementById('slideText');
  let val = el.value.trim();
  const m = val.match(/^(\d+)\/(\d+)$/);
  if (m) {
    let current = parseInt(m[1], 10);
    let total = parseInt(m[2], 10);
    
    if (isNaN(current) || current < 1) current = 1;
    if (isNaN(total) || total < 1) total = 1;
    
    // Cap current page at total pages
    if (current > total) {
      current = total;
    }
    
    const formatted = String(current).padStart(2, '0') + '/' + String(total).padStart(2, '0');
    if (updateInput && el.value !== formatted) {
      el.value = formatted;
    }
    return formatted;
  }
  return val;
}

function adjustSlideNum(dir) {
  const el = document.getElementById('slideText');
  const val = el.value.trim();
  const m = val.match(/^(\d+)\/(\d+)$/);
  if (m) {
    let current = parseInt(m[1], 10);
    const total = parseInt(m[2], 10);
    
    if (dir > 0) {
      if (current < total) {
        current++;
      }
    } else {
      if (current > 1) {
        current--;
      }
    }
    
    el.value = String(current).padStart(2, '0') + '/' + String(total).padStart(2, '0');
  } else {
    const num = parseInt(val, 10);
    if (!isNaN(num)) {
      el.value = String(Math.max(1, num + dir));
    }
  }
  draw();
}

function getFontStr(font, size) {
  switch (font) {
    case 'bold': return `800 ${size}px "Inter", sans-serif`;
    case 'italic': return `italic 400 ${size}px "Inter", sans-serif`;
    case 'bold-italic': return `italic 800 ${size}px "Inter", sans-serif`;
    case 'mono': return `500 ${size}px "Geist Mono", monospace`;
    default: return `600 ${size}px "Inter", sans-serif`;
  }
}

function wrapText(text, maxWidth) {
  const lines = [];
  text.split('\n').forEach(para => {
    if (!para) { lines.push(''); return; }
    const words = para.split(' ');
    let curLine = '';
    
    for (let i = 0; i < words.length; i++) {
      const word = words[i];
      const wordWidth = ctx.measureText(word).width;
      
      if (wordWidth > maxWidth) {
        for (let j = 0; j < word.length; j++) {
          const char = word[j];
          const testLine = curLine + char;
          if (ctx.measureText(testLine).width > maxWidth) {
            if (curLine) lines.push(curLine);
            curLine = char;
          } else {
            curLine = testLine;
          }
        }
      } else {
        const testLine = curLine ? curLine + ' ' + word : word;
        if (ctx.measureText(testLine).width > maxWidth) {
          if (curLine) lines.push(curLine);
          curLine = word;
        } else {
          curLine = testLine;
        }
      }
    }
    if (curLine) lines.push(curLine);
  });
  return lines;
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const maxBottomY = canvas.height - M - 50; // 1220px limit before footer

  // 1. Background
  if (state.bgType === 'photo' && state.bgPhoto) {
    ctx.drawImage(state.bgPhoto, state.bgPhotoX, state.bgPhotoY,
      state.bgPhoto.width * state.bgPhotoScale, state.bgPhoto.height * state.bgPhotoScale);
      
    // Apply dark gradient overlay to make text readable on bright photos
    if (state.bgOverlay > 0) {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, `rgba(0, 0, 0, ${state.bgOverlay * 0.7})`);
      g.addColorStop(1, `rgba(0, 0, 0, ${state.bgOverlay})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  } else if (state.bgType === 'gradient' || state.gradient) {
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, '#097EFF'); // Bright blue
    g.addColorStop(1, '#1E3A8A'); // Deep navy
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw Grain pattern if loaded
  if (grainPattern) {
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  ctx.textBaseline = 'top';

  // 2. Pre-calculate kicker width & height for Apla
  const kickerVal = document.getElementById('kickerText').value;
  if (kickerVal) {
    ctx.font = '500 20px "Geist Mono", monospace';
    ctx.letterSpacing = '6px';
    const lines = kickerVal.toUpperCase().split('\n');
    let maxW = 0;
    lines.forEach(l => {
      const w = ctx.measureText(l).width;
      if (w > maxW) maxW = w;
    });
    ctx.letterSpacing = '0px';
    hitBoxes.kicker = { x: state.kickerX, y: state.kickerY, w: maxW + 22, h: lines.length * 30 };
  } else {
    hitBoxes.kicker = null;
  }

  // 3. Pre-calculate Title size for Apla
  const titleMaxW = canvas.width - state.titleX - M;
  let ty = state.titleY;
  const titleStartY = ty;
  let maxLineWidth = 0;
  const rawLines = state.mainText.split('\n');
  let wordCounter = 0;
  
  rawLines.forEach((lineText, lineIndex) => {
    const curLineSize = state.lineSizes[lineIndex] || state.titleSize || 90;
    const lineWordTokens = lineText.trim().split(/\s+/).filter(Boolean);
    if (lineWordTokens.length === 0) {
      ty += curLineSize * state.titleLH;
      return;
    }
    const lineWords = [];
    lineWordTokens.forEach(token => {
      const wObj = state.words[wordCounter] || { text: token, font: 'bold', color: '#FFFFFF' };
      wordCounter++;
      ctx.font = getFontStr(wObj.font, curLineSize);
      const wWidth = ctx.measureText(wObj.text).width;
      if (wWidth > titleMaxW) {
        let curChunk = '';
        for (let j = 0; j < wObj.text.length; j++) {
          let char = wObj.text[j];
          if (ctx.measureText(curChunk + char).width > titleMaxW) {
            lineWords.push({ text: curChunk, font: wObj.font, color: wObj.color });
            curChunk = char;
          } else {
            curChunk += char;
          }
        }
        if (curChunk) {
          lineWords.push({ text: curChunk, font: wObj.font, color: wObj.color });
        }
      } else {
        lineWords.push(wObj);
      }
    });
    
    const subLines = [];
    let currentSubLine = [];
    let currentSubLineWidth = 0;
    
    lineWords.forEach(word => {
      ctx.font = getFontStr(word.font, curLineSize);
      const wordWidth = ctx.measureText(word.text).width;
      const spaceWidth = ctx.measureText(' ').width + (state.wordSpacing || 20);
      
      if (currentSubLineWidth + wordWidth > titleMaxW && currentSubLine.length > 0) {
        subLines.push(currentSubLine);
        currentSubLine = [word];
        currentSubLineWidth = wordWidth;
      } else {
        currentSubLine.push(word);
        currentSubLineWidth += wordWidth + spaceWidth;
      }
    });
    if (currentSubLine.length > 0) {
      subLines.push(currentSubLine);
    }
    
    subLines.forEach(subLine => {
      let tx = state.titleX;
      subLine.forEach(word => {
        ctx.font = getFontStr(word.font, curLineSize);
        const wordWidth = ctx.measureText(word.text).width;
        const spaceWidth = ctx.measureText(' ').width + (state.wordSpacing || 20);
        tx += wordWidth + spaceWidth;
      });
      const lineWidth = tx - state.titleX;
      if (lineWidth > maxLineWidth) maxLineWidth = lineWidth;
      ty += curLineSize * state.titleLH;
    });
  });
  const titleH = ty - titleStartY;
  hitBoxes.title = { x: state.titleX, y: titleStartY, w: Math.max(100, Math.min(maxLineWidth, titleMaxW)), h: titleH || 10 };

  // 4. Pre-calculate paragraph height for Apla
  const paraVal = document.getElementById('paraText').value;
  if (paraVal) {
    const paraSize = 28;
    ctx.font = `600 ${paraSize}px "Inter", sans-serif`;
    const py = ty + 30;
    state.paraY = py;
    const isCenter = state.paraAlign === 'center';
    const maxWidth = isCenter ? (canvas.width - M * 2) : (canvas.width - state.paraX - M);
    const uppercaseText = paraVal.toUpperCase();
    const wrapped = wrapText(uppercaseText, maxWidth);
    let currentPy = py;
    wrapped.forEach(wl => {
      currentPy += paraSize * 1.5;
    });
    const paragraphHeight = currentPy - py;
    const hitBoxX = isCenter ? (canvas.width / 2 - maxWidth / 2) : state.paraX;
    hitBoxes.para = { x: hitBoxX, y: py, w: maxWidth, h: paragraphHeight || 10 };
  } else {
    hitBoxes.para = null;
  }

  // DRAW APLA (Background Shape under text)
  if (state.showApla && state.aplaStyle !== 'none') {
    ctx.save();
    if (state.aplaStyle === 'light-glass') {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
      ctx.shadowBlur = 40;
    } else if (state.aplaStyle === 'dark-glass') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      ctx.shadowBlur = 40;
    } else if (state.aplaStyle === 'blue') {
      ctx.fillStyle = 'rgba(9, 126, 255, 0.9)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    } else if (state.aplaStyle === 'green') {
      ctx.fillStyle = 'rgba(0, 182, 122, 0.9)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    } else if (state.aplaStyle === 'navy') {
      ctx.fillStyle = 'rgba(30, 58, 138, 0.9)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    }
    
    drawRoundedRect(ctx, state.aplaX, state.aplaY, state.aplaW, state.aplaH, 24);
    ctx.fill();
    if (ctx.strokeStyle) {
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
    
    hitBoxes.apla = { x: state.aplaX, y: state.aplaY, w: state.aplaW, h: state.aplaH };

    // Draw active select border & circular handles when editing
    if (!isExporting) {
      ctx.save();
      ctx.strokeStyle = '#097EFF';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      drawRoundedRect(ctx, state.aplaX, state.aplaY, state.aplaW, state.aplaH, 24);
      ctx.stroke();
      ctx.setLineDash([]);
      
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = '#097EFF';
      ctx.lineWidth = 2.5;
      
      const handles = [
        { x: state.aplaX, y: state.aplaY }, // tl
        { x: state.aplaX + state.aplaW / 2, y: state.aplaY }, // tm
        { x: state.aplaX + state.aplaW, y: state.aplaY }, // tr
        { x: state.aplaX + state.aplaW, y: state.aplaY + state.aplaH / 2 }, // rm
        { x: state.aplaX + state.aplaW, y: state.aplaY + state.aplaH }, // br
        { x: state.aplaX + state.aplaW / 2, y: state.aplaY + state.aplaH }, // bm
        { x: state.aplaX, y: state.aplaY + state.aplaH }, // bl
        { x: state.aplaX, y: state.aplaY + state.aplaH / 2 } // lm
      ];
      
      handles.forEach(h => {
        ctx.beginPath();
        ctx.arc(h.x, h.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();
    }
  } else {
    hitBoxes.apla = null;
  }

  // Draw actual Kicker Text
  if (kickerVal) {
    ctx.fillStyle = state.kickerColor;
    ctx.beginPath();
    ctx.arc(state.kickerX + 5, state.kickerY + 11, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '500 20px "Geist Mono", monospace';
    ctx.fillStyle = state.kickerColor;
    ctx.textAlign = 'left';
    ctx.letterSpacing = '6px';
    const lines = kickerVal.toUpperCase().split('\n');
    let ky = state.kickerY;
    lines.forEach(l => {
      ctx.fillText(l, state.kickerX + 22, ky);
      ky += 30;
    });
    ctx.letterSpacing = '0px';
  }

  // Draw actual Title Text
  ty = state.titleY;
  wordCounter = 0;
  rawLines.forEach((lineText, lineIndex) => {
    const curLineSize = state.lineSizes[lineIndex] || state.titleSize || 90;
    const lineWordTokens = lineText.trim().split(/\s+/).filter(Boolean);
    if (lineWordTokens.length === 0) {
      ty += curLineSize * state.titleLH;
      return;
    }
    const lineWords = [];
    lineWordTokens.forEach(token => {
      const wObj = state.words[wordCounter] || { text: token, font: 'bold', color: '#FFFFFF' };
      wordCounter++;
      ctx.font = getFontStr(wObj.font, curLineSize);
      const wWidth = ctx.measureText(wObj.text).width;
      if (wWidth > titleMaxW) {
        let curChunk = '';
        for (let j = 0; j < wObj.text.length; j++) {
          let char = wObj.text[j];
          if (ctx.measureText(curChunk + char).width > titleMaxW) {
            lineWords.push({ text: curChunk, font: wObj.font, color: wObj.color });
            curChunk = char;
          } else {
            curChunk += char;
          }
        }
        if (curChunk) {
          lineWords.push({ text: curChunk, font: wObj.font, color: wObj.color });
        }
      } else {
        lineWords.push(wObj);
      }
    });
    
    const subLines = [];
    let currentSubLine = [];
    let currentSubLineWidth = 0;
    
    lineWords.forEach(word => {
      ctx.font = getFontStr(word.font, curLineSize);
      const wordWidth = ctx.measureText(word.text).width;
      const spaceWidth = ctx.measureText(' ').width + (state.wordSpacing || 20);
      
      if (currentSubLineWidth + wordWidth > titleMaxW && currentSubLine.length > 0) {
        subLines.push(currentSubLine);
        currentSubLine = [word];
        currentSubLineWidth = wordWidth;
      } else {
        currentSubLine.push(word);
        currentSubLineWidth += wordWidth + spaceWidth;
      }
    });
    if (currentSubLine.length > 0) {
      subLines.push(currentSubLine);
    }
    
    subLines.forEach(subLine => {
      if (ty + curLineSize * state.titleLH > maxBottomY) return;
      let tx = state.titleX;
      subLine.forEach(word => {
        ctx.font = getFontStr(word.font, word.font === 'mono' ? curLineSize * 0.9 : curLineSize);
        ctx.fillStyle = word.color;
        ctx.textAlign = 'left';
        ctx.fillText(word.text, tx, ty);
        
        const wordWidth = ctx.measureText(word.text).width;
        const spaceWidth = ctx.measureText(' ').width + (state.wordSpacing || 20);
        tx += wordWidth + spaceWidth;
      });
      ty += curLineSize * state.titleLH;
    });
  });

  // Draw actual Paragraph Text
  if (paraVal) {
    const paraSize = 28;
    ctx.font = `600 ${paraSize}px "Inter", sans-serif`;
    ctx.fillStyle = state.paraColor || '#FFFFFF';
    const py = ty + 30;
    
    const isCenter = state.paraAlign === 'center';
    const alignX = isCenter ? canvas.width / 2 : state.paraX;
    const maxWidth = isCenter ? (canvas.width - M * 2) : (canvas.width - state.paraX - M);
    
    ctx.textAlign = isCenter ? 'center' : 'left';
    
    const uppercaseText = paraVal.toUpperCase();
    const wrapped = wrapText(uppercaseText, maxWidth);
    let currentPy = py;
    wrapped.forEach(wl => {
      if (currentPy + paraSize * 1.5 > maxBottomY) return;
      ctx.fillText(wl, alignX, currentPy);
      currentPy += paraSize * 1.5;
    });
  }

  // 5. Brand (Stopka / Dopisek flatpack.help)
  const brandVal = document.getElementById('brandText').value;
  if (brandVal) {
    ctx.font = '800 22px "Inter", sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    
    const align = state.brandAlign;
    ctx.textAlign = align === 'center' ? 'center' : ((align === 'right' || align === 'top-right') ? 'right' : 'left');
    
    ctx.fillText(brandVal, state.brandX, state.brandY);
    
    const w = ctx.measureText(brandVal).width + 20;
    let bx = state.brandX;
    if (ctx.textAlign === 'center') bx -= w / 2;
    else if (ctx.textAlign === 'right') bx -= w;
    hitBoxes.brand = { x: bx, y: state.brandY, w: w, h: 24 };
  } else {
    hitBoxes.brand = null;
  }

  // 6. Slide (Numeracja)
  const slideVal = validateAndGetSlideText(false);
  if (slideVal && document.getElementById('showSlideNum').checked) {
    ctx.font = '600 20px "Geist Mono", monospace';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    
    ctx.textAlign = state.slideX > canvas.width / 2 ? 'right' : 'left';
    ctx.fillText(slideVal, state.slideX, state.slideY);
    
    const w = ctx.measureText(slideVal).width + 20;
    let sx = state.slideX;
    if (ctx.textAlign === 'right') sx -= w;
    hitBoxes.slide = { x: sx, y: state.slideY, w: w, h: 24 };
  } else {
    hitBoxes.slide = null;
  }

  // 7. Guides (Marginesy i siatka IG)
  if (!isExporting && document.getElementById('showGuides').checked) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, canvas.width, M);
    ctx.fillRect(0, canvas.height - M, canvas.width, M);
    ctx.fillRect(0, M, M, canvas.height - M * 2);
    ctx.fillRect(canvas.width - M, M, M, canvas.height - M * 2);
    ctx.strokeStyle = 'rgba(9, 126, 255, 0.5)';
    ctx.lineWidth = 3;
    ctx.setLineDash([16, 10]);
    ctx.strokeRect(M, M, canvas.width - M * 2, canvas.height - M * 2);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(9, 126, 255, 0.8)';
    ctx.font = 'bold 16px "Geist Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SAFE AREA (80PX)', canvas.width / 2, M - 6);
  }

  if (!isExporting && document.getElementById('showCrop').checked) {
    const cropY = (canvas.height - canvas.width) / 2;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(0, cropY);
    ctx.lineTo(canvas.width, cropY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, canvas.height - cropY);
    ctx.lineTo(canvas.width, canvas.height - cropY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.font = '12px "Geist Mono", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('crop 1:1 (siatka IG)', canvas.width - 10, cropY + 14);
  }

  if (!isExporting && document.getElementById('showGrid34') && document.getElementById('showGrid34').checked) {
    ctx.strokeStyle = 'rgba(0, 182, 122, 0.4)'; // Trustpilot green
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(34, 0);
    ctx.lineTo(34, canvas.height);
    ctx.moveTo(1046, 0);
    ctx.lineTo(1046, canvas.height);
    ctx.stroke();
    
    ctx.strokeStyle = 'rgba(9, 126, 255, 0.4)'; // blue
    ctx.beginPath();
    ctx.moveTo(135, 0);
    ctx.lineTo(135, canvas.height);
    ctx.moveTo(945, 0);
    ctx.lineTo(945, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.fillStyle = 'rgba(0, 182, 122, 0.6)';
    ctx.font = '12px "Geist Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('crop 3:4 dla 4:5 (34px)', 40, 40);
    
    ctx.fillStyle = 'rgba(9, 126, 255, 0.6)';
    ctx.fillText('crop 3:4 dla 1:1 (135px)', 141, 60);
  }

  // Draw Logo (Red Bag)
  if (state.showLogo && state.logoImg) {
    const h = 90 * (state.logoScale || 1);
    const w = (state.logoImg.width / state.logoImg.height) * h;
    ctx.drawImage(state.logoImg, state.logoX, state.logoY, w, h);
    
    hitBoxes.logo = { x: state.logoX, y: state.logoY, w: w, h: h };
  } else {
    hitBoxes.logo = null;
  }

  // Photo drag handle
  if (state.bgType === 'photo' && state.bgPhoto) {
    hitBoxes.photo = { x: 0, y: 0, w: canvas.width, h: canvas.height };
  } else {
    hitBoxes.photo = null;
  }
}

function hitTestAplaHandle(mx, my) {
  if (!state.showApla) return null;
  const tolerance = 15; // px hit tolerance
  
  // 1. corners
  // Top-Left (tl)
  if (Math.abs(mx - state.aplaX) <= tolerance && Math.abs(my - state.aplaY) <= tolerance) return 'tl';
  // Top-Right (tr)
  if (Math.abs(mx - (state.aplaX + state.aplaW)) <= tolerance && Math.abs(my - state.aplaY) <= tolerance) return 'tr';
  // Bottom-Left (bl)
  if (Math.abs(mx - state.aplaX) <= tolerance && Math.abs(my - (state.aplaY + state.aplaH)) <= tolerance) return 'bl';
  // Bottom-Right (br)
  if (Math.abs(mx - (state.aplaX + state.aplaW)) <= tolerance && Math.abs(my - (state.aplaY + state.aplaH)) <= tolerance) return 'br';
  
  // 2. edges
  // Top-Middle (tm)
  if (Math.abs(mx - (state.aplaX + state.aplaW / 2)) <= tolerance && Math.abs(my - state.aplaY) <= tolerance) return 'tm';
  // Bottom-Middle (bm)
  if (Math.abs(mx - (state.aplaX + state.aplaW / 2)) <= tolerance && Math.abs(my - (state.aplaY + state.aplaH)) <= tolerance) return 'bm';
  // Left-Middle (lm)
  if (Math.abs(mx - state.aplaX) <= tolerance && Math.abs(my - (state.aplaY + state.aplaH / 2)) <= tolerance) return 'lm';
  // Right-Middle (rm)
  if (Math.abs(mx - (state.aplaX + state.aplaW)) <= tolerance && Math.abs(my - (state.aplaY + state.aplaH / 2)) <= tolerance) return 'rm';
  
  return null;
}

function resizeApla(dx, dy, handle, startW, startH, startX, startY) {
  if (handle === 'br') {
    state.aplaW = Math.max(100, Math.min(canvas.width, startW + dx));
    state.aplaH = Math.max(100, Math.min(canvas.height, startH + dy));
  } else if (handle === 'bl') {
    state.aplaW = Math.max(100, Math.min(canvas.width, startW - dx));
    state.aplaX = Math.max(0, Math.min(startX + startW - 100, startX + dx));
    state.aplaH = Math.max(100, Math.min(canvas.height, startH + dy));
  } else if (handle === 'tl') {
    state.aplaW = Math.max(100, Math.min(canvas.width, startW - dx));
    state.aplaX = Math.max(0, Math.min(startX + startW - 100, startX + dx));
    state.aplaH = Math.max(100, Math.min(canvas.height, startH - dy));
    state.aplaY = Math.max(0, Math.min(startY + startH - 100, startY + dy));
  } else if (handle === 'tr') {
    state.aplaW = Math.max(100, Math.min(canvas.width, startW + dx));
    state.aplaH = Math.max(100, Math.min(canvas.height, startH - dy));
    state.aplaY = Math.max(0, Math.min(startY + startH - 100, startY + dy));
  } else if (handle === 'rm') {
    state.aplaW = Math.max(100, Math.min(canvas.width, startW + dx));
  } else if (handle === 'lm') {
    state.aplaW = Math.max(100, Math.min(canvas.width, startW - dx));
    state.aplaX = Math.max(0, Math.min(startX + startW - 100, startX + dx));
  } else if (handle === 'bm') {
    state.aplaH = Math.max(100, Math.min(canvas.height, startH + dy));
  } else if (handle === 'tm') {
    state.aplaH = Math.max(100, Math.min(canvas.height, startH - dy));
    state.aplaY = Math.max(0, Math.min(startY + startH - 100, startY + dy));
  }
  
  // Sync to DOM inputs
  const aplaWEl = document.getElementById('aplaW');
  if (aplaWEl) {
    aplaWEl.value = state.aplaW;
    document.getElementById('aplaWVal').textContent = state.aplaW + 'px';
  }
  const aplaHEl = document.getElementById('aplaH');
  if (aplaHEl) {
    aplaHEl.value = state.aplaH;
    document.getElementById('aplaHVal').textContent = state.aplaH + 'px';
  }
}

function hitTest(mx, my) {
  const order = ['logo', 'kicker', 'title', 'para', 'brand', 'slide', 'apla'];
  for (const id of order) {
    const b = hitBoxes[id];
    if (b && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      return id;
    }
  }
  return null;
}

function canvasCoords(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

canvas.addEventListener('mousedown', (e) => {
  const { x, y } = canvasCoords(e);
  
  const handle = hitTestAplaHandle(x, y);
  if (handle) {
    dragging = {
      id: 'apla-resize',
      handle: handle,
      startW: state.aplaW,
      startH: state.aplaH,
      startX: state.aplaX,
      startY: state.aplaY,
      mouseStartX: x,
      mouseStartY: y
    };
    return;
  }
  
  const hit = hitTest(x, y);
  if (hit && hit !== 'photo') {
    const b = hitBoxes[hit];
    dragging = { id: hit, offsetX: x - b.x, offsetY: y - b.y };
  } else if (hit === 'photo' && state.bgPhoto) {
    dragging = { id: 'photo', offsetX: x - state.bgPhotoX, offsetY: y - state.bgPhotoY };
  }
});

window.addEventListener('mouseup', () => { dragging = null; });

canvas.addEventListener('mousemove', (e) => {
  const { x, y } = canvasCoords(e);
  
  if (!dragging) {
    const handle = hitTestAplaHandle(x, y);
    if (handle) {
      if (handle === 'tl' || handle === 'br') canvas.style.cursor = 'nwse-resize';
      else if (handle === 'tr' || handle === 'bl') canvas.style.cursor = 'nesw-resize';
      else if (handle === 'rm' || handle === 'lm') canvas.style.cursor = 'ew-resize';
      else if (handle === 'tm' || handle === 'bm') canvas.style.cursor = 'ns-resize';
      return;
    }
    
    const hovered = hitTest(x, y);
    state.hoveredBlock = hovered;
    
    if (hovered && hovered !== 'photo') {
      canvas.style.cursor = 'pointer';
    } else if (hovered === 'photo') {
      canvas.style.cursor = 'grab';
    } else {
      canvas.style.cursor = 'default';
    }
    return;
  }
  
  if (dragging.id === 'apla-resize') {
    const dx = x - dragging.mouseStartX;
    const dy = y - dragging.mouseStartY;
    resizeApla(dx, dy, dragging.handle, dragging.startW, dragging.startH, dragging.startX, dragging.startY);
    draw();
    return;
  }
  
  const nx = x - dragging.offsetX;
  const ny = y - dragging.offsetY;

  if (dragging.id === 'photo') {
    state.bgPhotoX = nx;
    state.bgPhotoY = ny;
    canvas.style.cursor = 'grabbing';
  } else {
    const cx = Math.max(M, Math.min(canvas.width - M, nx));
    const cy = Math.max(M, Math.min(canvas.height - M, ny));
    switch (dragging.id) {
      case 'logo': state.logoX = cx; state.logoY = cy; break;
      case 'kicker': state.kickerX = cx; state.kickerY = cy; break;
      case 'title': state.titleX = cx; state.titleY = cy; break;
      case 'para': state.paraX = cx; state.paraY = cy; break;
      case 'brand': state.brandX = cx; state.brandY = cy; break;
      case 'slide': state.slideX = cx; state.slideY = cy; break;
      case 'apla': state.aplaX = nx; state.aplaY = ny; break;
    }
  }
  draw();
});

canvas.addEventListener('mouseleave', () => {
  state.hoveredBlock = null;
  canvas.style.cursor = 'default';
});

canvas.addEventListener('wheel', (e) => {
  if (!state.bgPhoto) return;
  e.preventDefault();
  
  const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
  const newScale = Math.max(state.bgPhotoScale * 0.05, Math.min(state.bgPhotoScale * 10, state.bgPhotoScale * zoomFactor));
  
  const { x, y } = canvasCoords(e);
  
  const imgMouseX = (x - state.bgPhotoX) / state.bgPhotoScale;
  const imgMouseY = (y - state.bgPhotoY) / state.bgPhotoScale;
  
  state.bgPhotoX = x - imgMouseX * newScale;
  state.bgPhotoY = y - imgMouseY * newScale;
  state.bgPhotoScale = newScale;
  
  const scaleSlider = document.getElementById('photoScale');
  if (scaleSlider) {
    scaleSlider.value = newScale.toFixed(2);
    document.getElementById('photoScaleVal').textContent = newScale.toFixed(2) + 'x';
  }
  
  draw();
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const activeEl = document.activeElement;
    const isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
    
    if (!isTyping && state.hoveredBlock) {
      e.preventDefault();
      const blockId = state.hoveredBlock;
      
      if (blockId === 'photo') {
        clearPhoto();
        return;
      }
      
      let inputEl = null;
      if (blockId === 'title') inputEl = document.getElementById('mainText');
      else if (blockId === 'kicker') inputEl = document.getElementById('kickerText');
      else if (blockId === 'para') inputEl = document.getElementById('paraText');
      else if (blockId === 'brand') inputEl = document.getElementById('brandText');
      else if (blockId === 'slide') inputEl = document.getElementById('slideText');
      
      if (inputEl) {
        inputEl.value = '';
        inputEl.focus();
        if (blockId === 'title') {
          updateWordsFromText('');
        } else {
          draw();
        }
      }
    }
  }
});

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  const { x, y } = canvasCoords(e.touches[0]);
  
  const handle = hitTestAplaHandle(x, y);
  if (handle) {
    dragging = {
      id: 'apla-resize',
      handle: handle,
      startW: state.aplaW,
      startH: state.aplaH,
      startX: state.aplaX,
      startY: state.aplaY,
      mouseStartX: x,
      mouseStartY: y
    };
    return;
  }
  
  const hit = hitTest(x, y);
  if (hit && hit !== 'photo') {
    const b = hitBoxes[hit];
    dragging = { id: hit, offsetX: x - b.x, offsetY: y - b.y };
  } else if (hit === 'photo' && state.bgPhoto) {
    dragging = { id: 'photo', offsetX: x - state.bgPhotoX, offsetY: y - state.bgPhotoY };
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (!dragging || e.touches.length !== 1) return;
  e.preventDefault();
  const { x, y } = canvasCoords(e.touches[0]);
  
  if (dragging.id === 'apla-resize') {
    const dx = x - dragging.mouseStartX;
    const dy = y - dragging.mouseStartY;
    resizeApla(dx, dy, dragging.handle, dragging.startW, dragging.startH, dragging.startX, dragging.startY);
    draw();
    return;
  }
  
  const nx = x - dragging.offsetX;
  const ny = y - dragging.offsetY;
  if (dragging.id === 'photo') {
    state.bgPhotoX = nx;
    state.bgPhotoY = ny;
  } else {
    const cx = Math.max(M, Math.min(canvas.width - M, nx));
    const cy = Math.max(M, Math.min(canvas.height - M, ny));
    switch (dragging.id) {
      case 'logo': state.logoX = cx; state.logoY = cy; break;
      case 'kicker': state.kickerX = cx; state.kickerY = cy; break;
      case 'title': state.titleX = cx; state.titleY = cy; break;
      case 'para': state.paraX = cx; state.paraY = cy; break;
      case 'brand': state.brandX = cx; state.brandY = cy; break;
      case 'slide': state.slideX = cx; state.slideY = cy; break;
      case 'apla': state.aplaX = nx; state.aplaY = ny; break;
    }
  }
  draw();
}, { passive: false });

canvas.addEventListener('touchend', () => { dragging = null; });

function downloadImage() {
  isExporting = true;
  draw();
  try {
    const url = canvas.toDataURL('image/png', 1.0);
    const link = document.createElement('a');
    link.download = 'post_ig_' + Date.now() + '.png';
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    alert('Błąd eksportu. Spróbuj najpierw wgrać zdjęcie przyciskiem "Z dysku".');
  }
  isExporting = false;
  draw();
}

function closePreview() {
  document.getElementById('previewModal').style.display = 'none';
}

function executeDownload() {
  closePreview();
  downloadImage();
}

function toggleAplaControls(show) {
  const ctrl = document.getElementById('aplaControls');
  if (ctrl) {
    ctrl.style.display = show ? 'block' : 'none';
  }
}

function resetAplaPosition() {
  state.aplaX = (canvas.width - state.aplaW) / 2;
  state.aplaY = (canvas.height - state.aplaH) / 2;
  draw();
}

// Initial initialization
document.getElementById('mainText').value = state.mainText;
document.getElementById('paraText').value = state.paraText;
document.getElementById('showApla').checked = state.showApla;
toggleAplaControls(state.showApla);
document.getElementById('aplaStyle').value = state.aplaStyle;
document.getElementById('aplaW').value = state.aplaW;
document.getElementById('aplaWVal').textContent = state.aplaW + 'px';
document.getElementById('aplaH').value = state.aplaH;
document.getElementById('aplaHVal').textContent = state.aplaH + 'px';
document.getElementById('logoScale').value = state.logoScale;
document.getElementById('logoScaleVal').textContent = state.logoScale + 'x';
updateWordsFromText(state.mainText);
